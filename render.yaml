# Configuration for deploying to Render.com

services:
  - type: web
    name: rag-backend-api
    env: python
    plan: standard
    pythonVersion: 3.11
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: OPENAI_API_KEY
        scope: secret
      - key: QDRANT_URL
        value: https://your-qdrant-cloud-url.com:6333
      - key: QDRANT_API_KEY
        scope: secret
      - key: GROQ_API_KEY
        scope: secret
        required: false

databases:
  - name: qdrant-storage
    plan: standard
    databaseName: qdrant
    version: latest
